name: Deploy
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [ main ]
  release:
    types: [published]

permissions:
  id-token: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  VERSION: "0.0.0-dev"
  REGISTRY: ghcr.io
  # Published as ghcr.io/sierrasoftworks/bender/bender (see docs/hosting).
  IMAGE_NAME: ${{ github.repository }}/bender

jobs:
  version:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      - name: Set Package Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: Cargo.toml

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --all-features --no-fail-fast
        env:
            RUSTFLAGS: "-C instrument_coverage"
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    needs:
      - version

    strategy:
      matrix:
        include:
          # Windows builds
          - arch: amd64
            os: windows
            run_on: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            cargo-flags: ""

          # Linux builds
          - arch: amd64
            run_on: ubuntu-latest
            os: linux
            target: x86_64-unknown-linux-musl
            test: true
            setup: |
              sudo apt update && sudo apt install -y musl-tools
            cargo-flags: "--features openssl-vendored"

          - arch: "arm64"
            os: linux
            run_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            setup: |
              sudo apt update && sudo apt install -y musl-tools
            cargo-flags: "--features openssl-vendored"

          # Apple MacOS builds
          - arch: amd64
            run_on: macos-latest
            os: darwin
            target: x86_64-apple-darwin
            cargo-flags: "--features openssl-vendored"
          - arch: arm64
            run_on: macos-latest
            os: darwin
            target: aarch64-apple-darwin
            cargo-flags: "--features openssl-vendored"

    steps:
      - name: Run setup script
        if: ${{ matrix.setup }}
        run: ${{ matrix.setup }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview

      # Set up the cache before fetching the versioned Cargo.toml.
      # Swatinem/rust-cache derives its cache key from the contents of
      # Cargo.toml/Cargo.lock, so restoring the version-bumped Cargo.toml first
      # would change the key on release builds and prevent any cache from being
      # restored, forcing a full rebuild every time.
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Give each matrix entry its own cache scope so the jobs don't clobber
          # one another's caches.
          key: ${{ matrix.target }}

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile

      - name: cargo build
        env:
          # Line tables in release builds so published symbols carry source
          # attribution; PR/push builds keep the default (no debug info).
          CARGO_PROFILE_RELEASE_DEBUG: ${{ github.event_name == 'release' && '1' || 'false' }}
          # Static musl links don't emit a GNU build-id note by default; the
          # symbols pipeline keys everything off it.
          RUSTFLAGS: ${{ matrix.os == 'linux' && '-C link-arg=--build-id=sha1' || '' }}
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo-flags }}

      # Publish debug symbols to symbols.sierrasoftworks.com (build ID derived
      # server-side; authenticated with this workflow's OIDC id-token) so
      # Pyroscope's symbolizer and debuggers can resolve production frames.
      # On Linux and macOS the action re-strips the binary after splitting the
      # symbols out, so release assets keep their usual size.
      - name: Publish debug symbols
        uses: SierraSoftworks/symbols@v1
        if: github.event_name == 'release'
        with:
          binary: target/${{ matrix.target }}/release/${{ github.event.repository.name }}${{ matrix.extension }}
          version: ${{ github.event.release.tag_name }}

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "target/${{ matrix.target }}/release/${{ github.event.repository.name }}${{ matrix.extension }} | ${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/${{ github.event.repository.name }}${{ matrix.extension }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - build

    # Publish a fresh multi-arch image for every commit that lands on main, as
    # well as for tagged releases. Pull requests build binaries but do not push.
    if: github.event_name == 'push' || github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: set environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Pull in platform artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ env.PLATFORM_PAIR }}

      - name: mark artifact as executable
        run: |
          chmod +x ${{ github.event.repository.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=Your unfriendly source of Futurama quotes

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs:
      - docker-build

    if: github.event_name == 'push' || github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: set environment variables
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
